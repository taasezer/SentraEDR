[workspace]
resolver = "2"
members = [
    "crates/sentra-core",
    "crates/sentra-ipc",
    "crates/sentra-telemetry",
    "crates/sentra-detection",
    "crates/sentra-process",
    "crates/sentra-network",
    "crates/sentra-persistence",
    "crates/sentra-remediation",
    "crates/sentra-cli",
    "crates/sentra-service",
    "crates/sentra-ui/src-tauri"
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["SentraEDR Team"]
repository = "https://github.com/taasezer/SentraEDR"

[workspace.dependencies]
# --- Microsoft Official Windows Bindings ---
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Diagnostics_Etw",
    "Win32_System_Time",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_System_Memory",
    "Win32_System_Services",
    "Win32_System_ProcessStatus",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
] }
windows-registry = "0.4"

# --- Async Runtime ---
tokio = { version = "1", features = ["full"] }

# --- Serialization ---
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml_edit = { version = "0.22", features = ["serde"] }
postcard = { version = "1", features = ["alloc"] }

# --- Logging ---
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# --- Concurrency ---
crossbeam-channel = "0.5"
parking_lot = "0.12"

# --- System ---
sysinfo = "0.33"
goblin = "0.9"

# --- CLI ---
clap = { version = "4", features = ["derive"] }
ratatui = "0.29"
crossterm = "0.28"

# --- Service ---
windows-service = "0.7"

# --- Error Handling ---
thiserror = "2"
anyhow = "1"

# --- Utilities ---
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
panic = "abort"
codegen-units = 1
